# sample-shepherd config. `sample-shepherd config init` writes this file to
# ~/.config/sample-shepherd/config.toml; or pass --config, or put it in the current folder
# as sample-shepherd.toml. Relative paths are read from this file's folder. Every setting is
# optional, and command-line flags override it. `sample-shepherd config show` prints the result.

# Where backups, listings, plans and logs go when a command isn't given a path.
work_dir = "~/sample-shepherd"

[device]
backend = "elektron"   # the only backend so far (Elektron devices via elektroid-cli)
id = 1                 # from `sample-shepherd device ls`; 0 is the computer itself

[elektroid]
# elektroid-cli: a name on PATH, or a path to the one you built (see README, "Elektroid").
cli = "elektroid-cli"
# cli = "~/opt/elektroid/bin/elektroid-cli"

[fourier]
# The `fourier` command: a name on PATH, or the venv of the patched build made by
# `sample-shepherd organize install-fourier --dir ~/opt/fourier-samples`.
command = "fourier"
# command = "~/opt/fourier-samples/.venv/bin/fourier"
# Environment for every fourier run. FOURIER_HOME keeps Fourier's database and state in one
# folder; FOURIER_CONFIG points at a config file of your own (see examples/fourier.toml).
env = { FOURIER_HOME = "~/sample-shepherd/fourier-home" }
# env = { FOURIER_HOME = "~/sample-shepherd/fourier-home", FOURIER_CONFIG = "~/sample-shepherd/fourier.toml" }

[export]
# Extra folders of device profiles (YAML), searched before the bundled ones.
profile_dirs = []

[sync]
# Device paths `plan` never deletes from, whatever the plan inputs say. Add your own
# recordings and anything else you keep only on the device.
protected = ["/factory"]

[transfer]
# Used for time estimates only. Measured on a Digitakt II over USB (2026-11-06); `sync`
# prints your measured speed as it goes, so put your own numbers here.
bytes_per_second = 77000
seconds_per_call = 1.6
