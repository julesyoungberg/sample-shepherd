# Fourier config, written by fourier setup on 2026-10-26.
# fourier config show prints what it resolves to; fourier doctor checks it.
library = ["/Users/jules/Music/Ableton/User Library/Samples/sample packs/2024", "/Users/jules/Music/Ableton/User Library/Samples/sample packs/2025", "/Users/jules/Music/Ableton/User Library/Samples/sample packs/2026", "/Users/jules/Music/Ableton/User Library/Samples/sample packs/old"]     # the year folders of sample packs (read, never written); each pack folder is a vendor
devices = ["digitakt_2_50", "generic_folder", "generic_folder_3", "digitakt_2_50_3"]     # fourier devices list; fourier devices show <id>
preset = "balanced"        # the style: balanced, ambient-cinematic, breaks-acid, hiphop-lofi, house-techno, trap, or a file
vendors = "auto"         # a library's layout decides its vendors (first-folder: vendor/pack/...)
fold = "auto"            # half- and double-time loops fold into the style's tempo range (or "off")
retune = "off"           # keep every pitch and name; other "prepared" fixes (DC, clicks, loudness) stay on

scale = "off"            # full balanced budgets, not sized down to the library
overlay = "overlay.yaml" # folder shaping (config/overlay.yaml)
words = { VOX = ["acapella", "acapellas"] }   # 2024/Acapellas is vocals

[output]
master = "/Users/jules/sample-work/out/full2/master"
renders = "/Users/jules/sample-work/out/full2/renders"
publish = "/Users/jules/sample-work/out/full2/publish"
