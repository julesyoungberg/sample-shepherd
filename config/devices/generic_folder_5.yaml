# A folder for Ableton Live / XO with five folder levels: SECTION/CATEGORY/group/subgroup/family.
# The fifth level appears only under a nested group (Fourier patches 0010-0011).
# Everything else (44.1 kHz / 24-bit WAV) comes from the package's generic_folder.
id: generic_folder_5
extends: generic_folder
name: Generic folder, five levels
paths:
  folder_depth: {value: 5, status: convention}        # user's choice (Fourier patch 0010)
