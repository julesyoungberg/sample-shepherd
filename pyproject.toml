[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sample-shepherd"
version = "0.1.0"
description = "Organize a sample library, export it per device, and sync it to hardware samplers safely"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jules Youngberg" }]
dependencies = ["pyyaml>=6"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Stock Fourier from PyPI. Our own profiles and overlay need the patched build instead:
# see `sample-shepherd organize install-fourier`.
organize = ["fourier-samples>=0.1.2,<0.2"]

[project.scripts]
sample-shepherd = "sample_shepherd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_shepherd"]

[tool.hatch.build.targets.wheel.force-include]
"config/devices" = "sample_shepherd/profiles"
"config/patches" = "sample_shepherd/patches"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "config/devices/", "config/patches/", "docs/", "examples/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
